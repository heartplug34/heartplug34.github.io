media:
  - name: images
    label: 图片
    input: source/img
    output: /img
    categories: [image]
  - name: files
    label: 附件
    input: source/files
    output: /files
    extensions:
      - pdf
      - zip
      - 7z
      - rar
      - tar
      - gz
      - xz
      - txt
      - md
      - csv
      - docx
      - xlsx
      - pptx
      - apk
      - deb
      - exe
      - msi
      - dmg
      - iso
      - img
      - bin
      - jar

content:
  - name: posts
    label: 文章
    type: collection
    path: source/_posts
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{hour}{minute}{second}.md"
      field: create
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 日期
        type: date
      - name: categories
        label: 分类
        type: string
        list: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: body
        label: 正文
        type: rich-text
