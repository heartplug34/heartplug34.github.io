title: 个人博客记录
subtitle: '记录折腾、系统与硬件'
description: '个人博客记录'
author: 个人博客记录
language: zh-CN
timezone: 'Asia/Shanghai'
url: https://heartplug34.github.io
root: /
permalink: :year/:month/:day/:title/
pretty_urls:
  trailing_index: false
  trailing_html: false
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
new_post_name: :title.md
default_layout: post
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
default_category: uncategorized
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'
per_page: 10
pagination_dir: page
theme: fluid
index_generator:
  path: ''
  per_page: 10
  order_by: -date
archive_generator:
  enabled: true
  per_page: 20
  yearly: true
  monthly: true
  order_by: -date
category_generator:
  per_page: 10
tag_generator:
  per_page: 10
